<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#181818}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181818);
// A triangle pointing at the camera.
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-0.5,-0.5,0, 0.5,-0.5,0, 0,0.5,0]), 3));
g.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array([0,0,1, 0,0,1, 0,0,1]), 3));
g.setIndex([0, 1, 2]);
const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xff8844, side: THREE.DoubleSide }));
scene.add(mesh);
// Cast a ray from (0,0,2) toward -Z. Should hit the triangle.
const raycaster = new THREE.Raycaster(new THREE.Vector3(0, 0, 2), new THREE.Vector3(0, 0, -1));
const hits = raycaster.intersectObject(mesh);
const color = hits.length > 0 ? 0x44ff44 : 0xff4444;
// Render a colored quad showing the hit/miss result.
const indicator = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4),
    new THREE.MeshBasicMaterial({ color }));
indicator.position.set(0, 0, 1);
scene.add(indicator);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
