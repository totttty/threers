<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#1a1a22}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap;display:none"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'https://unpkg.com/three@0.165.0/examples/jsm/objects/Reflector.js';
const errEl = document.getElementById('err');
try {
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a22);
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dl = new THREE.DirectionalLight(0xffffff, 0.5);
dl.position.set(1, 2, 3);
scene.add(dl);

const cube = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshBasicMaterial({ color: 0xff6644 })
);
cube.position.set(0.4, 0.4, 1.0);
scene.add(cube);

const reflectorGeom = new THREE.PlaneGeometry(4, 3);
const reflector = new Reflector(reflectorGeom, {
    color: 0x7f7f7f,
    textureWidth: 800,
    textureHeight: 600,
});
// Reflector plane at z=0 facing +z (default PlaneGeometry orientation).
scene.add(reflector);

const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
} catch (e) { errEl.style.display='block'; errEl.textContent = e?.stack || String(e); document.body.dataset.ready = 'error'; }
</script></body></html>
