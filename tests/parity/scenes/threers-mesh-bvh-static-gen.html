<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101418}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas><div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
import { installMeshBvh, MeshBVH, StaticGeometryGenerator } from '/web/mesh-bvh-addon.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        installMeshBvh(THREE);
        const root = new THREE.Group();
        const m1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0x5588cc }));
        m1.position.set(-0.4, 0, 0);
        const m2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0x88aa55 }));
        m2.position.set(0.5, 0.2, 0);
        root.add(m1, m2);
        const gen = new StaticGeometryGenerator(root);
        const merged = gen.generate();
        merged.boundsTree = new MeshBVH(merged);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101418);
        const mesh = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: 0x7788aa, roughness: 0.5 }));
        scene.add(mesh);
        const cam = new THREE.PerspectiveCamera(50, 800/600, 0.1, 100);
        cam.position.set(0, 0.3, 2.5); cam.lookAt(0, 0, 0);
        cam.updateMatrixWorld(true);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), cam);
        const hits = raycaster.intersectObject(mesh);
        if (hits.length) {
            const marker = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
            marker.position.copy(hits[0].point);
            scene.add(marker);
        }
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
        document.body.dataset.hitCount = String(hits.length);
        const triCount = merged.index ? merged.index.array.length / 3 : merged.attributes.position.array.length / 9;
        document.body.dataset.triCount = String(triCount | 0);
    } catch (e) {
        errEl.style.display = 'block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
