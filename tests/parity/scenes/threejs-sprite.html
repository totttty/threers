<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0c0c20}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c20);
const mat = new THREE.SpriteMaterial({ color: 0xffaa44 });
const s = new THREE.Sprite(mat);
s.position.set(0, 0, 0);
s.scale.set(0.6, 0.6, 0.6);
scene.add(s);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
