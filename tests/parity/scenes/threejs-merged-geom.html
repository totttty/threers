<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#181818}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import * as BufferGeometryUtils from 'https://unpkg.com/three@0.165.0/examples/jsm/utils/BufferGeometryUtils.js';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181818);
const mkTri = (xOff) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-0.3 + xOff, -0.3, 0, 0.3 + xOff, -0.3, 0, xOff, 0.3, 0]), 3));
    g.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array([0,0,1,0,0,1,0,0,1]), 3));
    g.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array([0,0,1,0,0.5,1]), 2));
    g.setIndex([0, 1, 2]);
    return g;
};
const merged = BufferGeometryUtils.mergeGeometries([mkTri(-0.5), mkTri(0.5)]);
const mesh = new THREE.Mesh(merged, new THREE.MeshBasicMaterial({ color: 0xff8844, side: THREE.DoubleSide }));
scene.add(mesh);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 2.4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
