<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#1c1c22}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const errEl = document.getElementById('err');
try {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1c1c22);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dl = new THREE.DirectionalLight(0xffffff, 1.0);
    dl.position.set(2, 3, 4);
    scene.add(dl);
    const cube = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x66aaff, roughness: 0.5, metalness: 0 }));
    cube.name = 'Box';
    scene.add(cube);
    // Position track: animates from (-1, 0, 0) at t=0 to (1, 0, 0) at t=1.
    const posTrack = new THREE.VectorKeyframeTrack('Box.position', [0, 1], [-1, 0, 0, 1, 0, 0]);
    const clip = new THREE.AnimationClip('move', 1, [posTrack]);
    const mixer = new THREE.AnimationMixer(scene);
    const action = mixer.clipAction(clip);
    action.play();
    // Step to t=0.5 — cube should be at (0, 0, 0).
    mixer.update(0.5);
    if (Math.abs(cube.position.x) > 0.05) throw new Error('Cube did not move to t=0.5: x=' + cube.position.x);
    const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
    cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
    const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
    r.setSize(800, 600, false); r.setPixelRatio(1);
    r.render(scene, cam);
    document.body.dataset.ready = 'true';
} catch (e) { console.error(e); errEl.style.display='block'; errEl.textContent = e?.stack || String(e); document.body.dataset.ready = 'error'; }
</script></body></html>
