<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101418}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js","three-mesh-bvh":"https://unpkg.com/three-mesh-bvh@0.7.6/build/index.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { MeshBVH, acceleratedRaycast } from 'three-mesh-bvh';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
const a = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 16), new THREE.MeshStandardMaterial({ color: 0x4488cc }));
a.position.x = -0.6;
const b = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 16), new THREE.MeshStandardMaterial({ color: 0x66aa88 }));
b.position.x = 0.6;
scene.add(a, b);
a.geometry.boundsTree = new MeshBVH(a.geometry);
b.geometry.boundsTree = new MeshBVH(b.geometry);
a.raycast = acceleratedRaycast;
b.raycast = acceleratedRaycast;
const cam = new THREE.PerspectiveCamera(50, 800/600, 0.1, 100);
cam.position.set(0, 0, 4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
const raycaster = new THREE.Raycaster();
raycaster.set(new THREE.Vector3(-2, 0, 0), new THREE.Vector3(1, 0, 0));
const hits = raycaster.intersectObjects([a, b], false);
for (const h of hits) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff3333 }));
    m.position.copy(h.point);
    scene.add(m);
}
r.render(scene, cam);
document.body.dataset.ready = 'true';
document.body.dataset.hitCount = String(hits.length);
if (hits.length >= 2) document.body.dataset.hitDistance = hits.map(h => h.distance.toFixed(3)).join(',');
</script></body></html>
