<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/RenderPass.js';
import { SSAOPass } from 'https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/SSAOPass.js';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x888888);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(2, 4, 3);
scene.add(dir);
const floor = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 3), new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9 }));
floor.position.y = -0.6;
scene.add(floor);
const cube = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshStandardMaterial({ color: 0x6699ff, roughness: 0.6 }));
scene.add(cube);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0.5, 3.5); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
const composer = new EffectComposer(r);
composer.addPass(new RenderPass(scene, cam));
const ssao = new SSAOPass(scene, cam, 800, 600);
ssao.kernelRadius = 8;
ssao.output = SSAOPass.OUTPUT.Normal;
composer.addPass(ssao);
composer.render();
document.body.dataset.ready = 'true';
</script></body></html>
