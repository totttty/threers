<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#181818}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181818);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(2, 3, 4);
scene.add(dl);
const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0xff8855 }));
scene.add(cube);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
// First render: camera off-axis. We don't care about this output.
cam.position.set(2, 0, 3); cam.lookAt(0, 0, 0);
r.render(scene, cam);
// Second render: head-on camera and rotated cube. This is what gets captured.
cube.rotation.set(0.4, 0.6, 0);
cam.position.set(0, 0, 3.4); cam.lookAt(0, 0, 0);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
