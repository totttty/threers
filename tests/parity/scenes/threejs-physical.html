<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0c0c10}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c10);
scene.add(new THREE.AmbientLight(0xffffff, 0.1));
const dl = new THREE.DirectionalLight(0xffffff, 1.5);
dl.position.set(2, 3, 4);
scene.add(dl);
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.0, 48, 24),
    new THREE.MeshPhysicalMaterial({ color: 0xe05050, roughness: 0.25, metalness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.15 })
);
scene.add(sphere);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0.2, 3.5); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
