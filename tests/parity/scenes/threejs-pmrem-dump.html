<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0}</style></head><body>
<canvas id="c" width="16" height="16"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

try {
function solidFace(size, r, g, b) {
    const d = new Uint8Array(size * size * 4);
    for (let i = 0; i < size * size; i++) { d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=255; }
    return new THREE.DataTexture(d, size, size, THREE.RGBAFormat);
}

const size = 32;
const src = new THREE.CubeTexture([
    solidFace(size, 255, 64, 64),
    solidFace(size, 64, 255, 64),
    solidFace(size, 64, 64, 255),
    solidFace(size, 255, 255, 64),
    solidFace(size, 255, 64, 255),
    solidFace(size, 64, 255, 255),
]);
src.needsUpdate = true;

const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(16, 16, false);
const pmrem = new THREE.PMREMGenerator(r);
const env = pmrem.fromCubemap(src);
pmrem.dispose();

const w = env.width, h = env.height;
const data = new Float32Array(w * h * 4);
r.setRenderTarget(env);
r.readRenderTargetPixels(env, 0, 0, w, h, data);
r.setRenderTarget(null);

const maxMip = Math.floor(Math.log2(h)) - 2;

function roughnessToMip(roughness) {
    if (roughness >= 0.8) return (1.0 - roughness) / 0.2 - 2.0;
    if (roughness >= 0.4) return (0.8 - roughness) * 3.0 / 0.4 - 1.0;
    if (roughness >= 0.305) return (0.4 - roughness) / 0.095 + 2.0;
    if (roughness >= 0.21) return (0.305 - roughness) / 0.095 + 3.0;
    return -2.0 * Math.log2(1.16 * Math.max(roughness, 0.001));
}

function getFace(dir) {
    const ax = Math.abs(dir[0]), ay = Math.abs(dir[1]), az = Math.abs(dir[2]);
    if (ax > az) {
        if (ax > ay) return dir[0] > 0 ? 0 : 3;
        return dir[1] > 0 ? 1 : 4;
    }
    if (az > ay) return dir[2] > 0 ? 2 : 5;
    return dir[1] > 0 ? 1 : 4;
}

function getUV(dir, face) {
    let u, v;
    if (face === 0) { u = dir[2]/Math.abs(dir[0]); v = dir[1]/Math.abs(dir[0]); }
    else if (face === 1) { u = -dir[0]/Math.abs(dir[1]); v = -dir[2]/Math.abs(dir[1]); }
    else if (face === 2) { u = -dir[0]/Math.abs(dir[2]); v = dir[1]/Math.abs(dir[2]); }
    else if (face === 3) { u = -dir[2]/Math.abs(dir[0]); v = dir[1]/Math.abs(dir[0]); }
    else if (face === 4) { u = -dir[0]/Math.abs(dir[1]); v = dir[2]/Math.abs(dir[1]); }
    else { u = dir[0]/Math.abs(dir[2]); v = dir[1]/Math.abs(dir[2]); }
    return [0.5*(u+1), 0.5*(v+1)];
}

function sampleAtlas(dir, mipInt) {
    const CUBEUV_MIN_MIP = 4, MIN_TILE = 16;
    let face = getFace(dir);
    let uv = getUV(dir, face);
    const filterInt = Math.max(CUBEUV_MIN_MIP - mipInt, 0);
    mipInt = Math.max(mipInt, CUBEUV_MIN_MIP);
    const faceSize = 2 ** mipInt;
    uv[0] = uv[0] * (faceSize - 2) + 1;
    uv[1] = uv[1] * (faceSize - 2) + 1;
    if (face > 2) { uv[1] += faceSize; face -= 3; }
    uv[0] += face * faceSize;
    uv[0] += filterInt * 3 * MIN_TILE;
    uv[1] += 4 * (2 ** maxMip - faceSize);
    const u = uv[0] / w;
    const v = 1.0 - uv[1] / h;
    const x = u * (w - 1), y = v * (h - 1);
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const x1 = Math.min(x0+1, w-1), y1 = Math.min(y0+1, h-1);
    const tx = x - x0, ty = y - y0;
    const px = (xx, yy) => {
        const i = (yy * w + xx) * 4;
        return [data[i], data[i+1], data[i+2]];
    };
    const c00 = px(x0,y0), c10 = px(x1,y0), c01 = px(x0,y1), c11 = px(x1,y1);
    const out = [0,0,0];
    for (let c = 0; c < 3; c++) {
        const v0 = c00[c]*(1-tx)+c10[c]*tx;
        const v1 = c01[c]*(1-tx)+c11[c]*tx;
        out[c] = v0*(1-ty)+v1*ty;
    }
    return out;
}

function sampleEnv(dir, roughness) {
    const mip = Math.max(-2, Math.min(maxMip, roughnessToMip(roughness)));
    const mipI = Math.floor(mip);
    const mipF = mip - mipI;
    const c0 = sampleAtlas(dir, mipI);
    const c1 = sampleAtlas(dir, mipI + 1);
    return c0.map((v,i) => v*(1-mipF) + c1[i]*mipF);
}

const rough = 0.45;
const dirs = {
    '+X': [1,0,0], '-X': [-1,0,0], '+Y': [0,1,0], '-Y': [0,-1,0],
    '+Z': [0,0,1], '-Z': [0,0,-1],
};
const out = { atlasSize: [w, h], maxMip, nonZero: data.some(v => v !== 0) };
for (const [k, d] of Object.entries(dirs)) {
    out[k] = sampleEnv(d, rough);
}
document.body.dataset.samples = JSON.stringify(out);
document.body.dataset.ready = 'true';
} catch (e) {
    document.body.dataset.error = e?.stack || String(e);
    document.body.dataset.ready = 'error';
}
</script></body></html>
