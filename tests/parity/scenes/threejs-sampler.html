<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
// 4×4 checker DataTexture — 2 colors. With NearestFilter the pixels stay
// sharp; with RepeatWrapping + UV*3 the pattern tiles 3 times.
const px = (r,g,b) => [r, g, b, 255];
const A = px(255, 102, 51), B = px(34, 102, 204);
const data = new Uint8Array([
    ...A, ...B, ...A, ...B,
    ...B, ...A, ...B, ...A,
    ...A, ...B, ...A, ...B,
    ...B, ...A, ...B, ...A,
]);
const tex = new THREE.DataTexture(data, 4, 4);
tex.magFilter = THREE.NearestFilter;
tex.minFilter = THREE.NearestFilter;
tex.wrapS = THREE.RepeatWrapping;
tex.wrapT = THREE.RepeatWrapping;
tex.needsUpdate = true;
// Build a plane with explicit UV*3 so RepeatWrapping kicks in.
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    -0.8, -0.8, 0,  0.8, -0.8, 0,  0.8, 0.8, 0,  -0.8, 0.8, 0,
]), 3));
g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([
    0, 0,  3, 0,  3, 3,  0, 3,
]), 2));
g.setIndex([0, 1, 2,  0, 2, 3]);
const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: tex }));
scene.add(mesh);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 2.4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
