<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101822}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101822);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
const pl = new THREE.PointLight(0xffe0c0, 2.0, 0, 2);
pl.position.set(2.0, 2.5, 2.0);
scene.add(pl);
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.0, 32, 16),
    new THREE.MeshStandardMaterial({ color: 0x4090ff, roughness: 0.35, metalness: 0.0 })
);
scene.add(sphere);
const cam = new THREE.PerspectiveCamera(50, 800/600, 0.1, 100);
cam.position.set(0, 0, 3.5);
cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
