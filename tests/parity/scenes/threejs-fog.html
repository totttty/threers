<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#88aacc}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88aacc);
scene.fog = new THREE.Fog(0x88aacc, 2, 12);
const dl = new THREE.DirectionalLight(0xffffff, 0.0); // no lighting, so basic color shows fog clearly
// Three boxes at increasing depth.
for (let i = 0; i < 3; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshBasicMaterial({ color: 0xff5544 }));
    m.position.set(0, 0, -i * 3);
    scene.add(m);
}
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0.6, 0.2, 2); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
