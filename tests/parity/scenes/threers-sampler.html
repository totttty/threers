<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        const px = (r,g,b) => [r, g, b, 255];
        const A = px(255, 102, 51), B = px(34, 102, 204);
        const data = new Uint8Array([
            ...A, ...B, ...A, ...B,
            ...B, ...A, ...B, ...A,
            ...A, ...B, ...A, ...B,
            ...B, ...A, ...B, ...A,
        ]);
        const tex = new THREE.DataTexture(data, 4, 4);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.needsUpdate = true;
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
            -0.8, -0.8, 0,  0.8, -0.8, 0,  0.8, 0.8, 0,  -0.8, 0.8, 0,
        ]), 3));
        g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([
            0, 0,  3, 0,  3, 3,  0, 3,
        ]), 2));
        g.setIndex([0, 1, 2,  0, 2, 3]);
        const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: tex }));
        scene.add(mesh);
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 2.4); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
