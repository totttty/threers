<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#1a1a22}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a22);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(2, 3, 4);
scene.add(dl);
// Vase-like profile.
const points = [
    new THREE.Vector2(0.4, -1.0),
    new THREE.Vector2(0.6, -0.5),
    new THREE.Vector2(0.5,  0.0),
    new THREE.Vector2(0.3,  0.5),
    new THREE.Vector2(0.5,  1.0),
];
const lathe = new THREE.Mesh(
    new THREE.LatheGeometry(points, 16),
    new THREE.MeshStandardMaterial({ color: 0xddaa66, roughness: 0.45, metalness: 0 })
);
lathe.rotation.set(0, 0.4, 0);
scene.add(lathe);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0.3, 4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
