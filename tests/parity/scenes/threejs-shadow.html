<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101820}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101820);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(3, 5, 2);
dl.castShadow = true;
dl.shadow.camera.left = -3; dl.shadow.camera.right = 3;
dl.shadow.camera.top = 3; dl.shadow.camera.bottom = -3;
dl.shadow.camera.near = 0.1; dl.shadow.camera.far = 20;
dl.shadow.mapSize.set(1024, 1024);
scene.add(dl);
// Caster cube
const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0xcc4444, roughness: 0.5, metalness: 0 })
);
cube.position.set(0, 0.5, 0);
cube.castShadow = true;
scene.add(cube);
// Receiver ground plane
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 6),
    new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.7, metalness: 0 })
);
ground.rotation.set(-Math.PI / 2, 0, 0);
ground.receiveShadow = true;
scene.add(ground);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(2.5, 3, 4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.shadowMap.enabled = true;
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
