<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0a0a14}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(2, 3, 4);
scene.add(dl);
const count = 9;
const geom = new THREE.BoxGeometry(0.4, 0.4, 0.4);
const mat = new THREE.MeshStandardMaterial({ color: 0xff8855, roughness: 0.5, metalness: 0 });
const ins = new THREE.InstancedMesh(geom, mat, count);
const tmp = new THREE.Matrix4();
let i = 0;
for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) {
    tmp.makeTranslation(x * 0.8, y * 0.8, 0);
    ins.setMatrixAt(i++, tmp);
}
scene.add(ins);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
