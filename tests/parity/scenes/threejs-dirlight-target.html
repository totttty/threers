<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0c0c0c}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c0c);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
const dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(3, 3, 0);
dl.target.position.set(-1, -1, 0);
scene.add(dl);
const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 16),
    new THREE.MeshStandardMaterial({ color: 0xddddff, roughness: 0.5 }));
scene.add(sphere);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
