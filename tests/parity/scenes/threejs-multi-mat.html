<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#181818}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181818);
// Two side-by-side quads in one geometry, drawn with different materials per group.
const positions = new Float32Array([
    -0.9, -0.4, 0,  -0.1, -0.4, 0,  -0.1,  0.4, 0,  -0.9,  0.4, 0,
     0.1, -0.4, 0,   0.9, -0.4, 0,   0.9,  0.4, 0,   0.1,  0.4, 0,
]);
const indices = [0, 1, 2,  0, 2, 3,  4, 5, 6,  4, 6, 7];
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
g.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(8 * 3).fill(0).map((_, i) => (i % 3 === 2) ? 1 : 0), 3));
g.setIndex(indices);
g.addGroup(0, 6, 0);
g.addGroup(6, 6, 1);
const materials = [
    new THREE.MeshBasicMaterial({ color: 0xff4444, side: THREE.DoubleSide }),
    new THREE.MeshBasicMaterial({ color: 0x44ff44, side: THREE.DoubleSide }),
];
const mesh = new THREE.Mesh(g, materials);
scene.add(mesh);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 2.4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
