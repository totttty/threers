<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#202020}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(2, 3, 4);
scene.add(dl);
// Parent group rotated, child mesh offset & rotated — exercises nested transforms.
const grp = new THREE.Group();
grp.rotation.set(0, 0.6, 0);
grp.position.set(0, 0, 0);
const child = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.8, 0.8),
    new THREE.MeshStandardMaterial({ color: 0xff8800, roughness: 0.4, metalness: 0.0 })
);
child.position.set(0.9, 0, 0);
child.rotation.set(0.3, 0, 0);
grp.add(child);
scene.add(grp);
const cam = new THREE.PerspectiveCamera(50, 800/600, 0.1, 100);
cam.position.set(0, 0.5, 3.5);
cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
