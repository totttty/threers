<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101418}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas><div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
import { installMeshBvh, MeshBVH } from '/web/mesh-bvh-addon.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        installMeshBvh(THREE);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101418);
        const geom = new THREE.SphereGeometry(0.9, 24, 12);
        const bvh = new MeshBVH(geom);
        const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0x335588, roughness: 0.6 }));
        scene.add(mesh);
        const query = { min: new THREE.Vector3(-0.2, -0.2, -0.2), max: new THREE.Vector3(0.2, 0.2, 0.2) };
        const sphere = { center: new THREE.Vector3(0.15, 0.1, 0), radius: 0.35 };
        const boxHit = bvh.intersectsBox(query);
        const sphereHit = bvh.intersectsSphere(sphere);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
        if (boxHit) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), markerMat);
            m.position.set(0, 0, 0);
            scene.add(m);
        }
        if (sphereHit) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), markerMat);
            m.position.copy(sphere.center);
            scene.add(m);
        }
        const cam = new THREE.PerspectiveCamera(50, 800/600, 0.1, 100);
        cam.position.set(2, 1.5, 3); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
        document.body.dataset.boxHit = String(boxHit);
        document.body.dataset.sphereHit = String(sphereHit);
    } catch (e) {
        errEl.style.display = 'block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
