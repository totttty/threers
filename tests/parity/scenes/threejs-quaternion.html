<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#181c20}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181c20);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.9);
dl.position.set(2, 3, 4);
scene.add(dl);
const cube = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2),
    new THREE.MeshStandardMaterial({ color: 0x44ddff, roughness: 0.5 }));
const q = new THREE.Quaternion();
q.setFromAxisAngle(new THREE.Vector3(1, 1, 0).normalize(), Math.PI / 4);
cube.quaternion.copy(q);
scene.add(cube);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3.5); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
