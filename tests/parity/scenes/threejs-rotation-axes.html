<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#1a1a1a}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(2, 3, 4);
scene.add(dl);
// Three boxes rotated around X, Y, Z respectively.
const mat = new THREE.MeshStandardMaterial({ color: 0xddaa55, roughness: 0.45, metalness: 0 });
const x = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat);
x.position.set(-1.4, 0, 0); x.rotation.set(Math.PI / 4, 0, 0);
scene.add(x);
const y = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat);
y.position.set(0, 0, 0); y.rotation.set(0, Math.PI / 4, 0);
scene.add(y);
const z = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat);
z.position.set(1.4, 0, 0); z.rotation.set(0, 0, Math.PI / 4);
scene.add(z);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0.3, 4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
