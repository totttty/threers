<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000010}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000010);
// Stars in a 5x5 grid.
const positions = [];
for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++) {
    positions.push(x * 0.4, y * 0.4, 0);
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
const pts = new THREE.Points(geom, new THREE.PointsMaterial({ color: 0xffff00, size: 12, sizeAttenuation: false }));
scene.add(pts);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3.5);
cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
