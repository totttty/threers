<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0a0a14}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(2, 3, 4);
scene.add(dl);
const left = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0xcc4444, roughness: 0.5, metalness: 0 })
);
left.position.set(-1.2, 0, 0);
left.rotation.set(0, 0.6, 0);
scene.add(left);
const right = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 24, 12),
    new THREE.MeshStandardMaterial({ color: 0x44cc88, roughness: 0.3, metalness: 0 })
);
right.position.set(1.2, 0, 0);
scene.add(right);
const cam = new THREE.PerspectiveCamera(55, 800/600, 0.1, 100);
cam.position.set(0, 0.4, 4);
cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
