<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        function solidFace(size, r, g, b) {
            const d = new Uint8Array(size * size * 4);
            for (let i = 0; i < size * size; i++) { d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=255; }
            return d;
        }
        const size = 32;
        const src = new THREE.CubeTexture(size,
            solidFace(size, 255, 64, 64),
            solidFace(size, 64, 255, 64),
            solidFace(size, 64, 64, 255),
            solidFace(size, 255, 255, 64),
            solidFace(size, 255, 64, 255),
            solidFace(size, 64, 255, 255),
        );

        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);

        const pmrem = new THREE.PMREMGenerator(r);
        const env = pmrem.fromCubemap(src);
        pmrem.dispose();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.environment = env.texture;

        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 48, 24),
            new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.45 })
        );
        scene.add(sphere);

        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
        r.render(scene, cam);

        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
