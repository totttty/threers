<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0a0a14}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.add(new THREE.AmbientLight(0xffffff, 0.2));
const dl = new THREE.DirectionalLight(0xffeecc, 0.6);
dl.position.set(3, 4, 2);
scene.add(dl);
const pl = new THREE.PointLight(0x60a0ff, 3.0, 0, 2);
pl.position.set(-2, 1, 2);
scene.add(pl);
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.0, 32, 16),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.45, metalness: 0.0 })
);
scene.add(sphere);
const cam = new THREE.PerspectiveCamera(50, 800/600, 0.1, 100);
cam.position.set(0, 0.5, 3.8);
cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
