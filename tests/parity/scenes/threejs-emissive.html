<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
// Dark scene with one tiny ambient + bright emissive cube
scene.add(new THREE.AmbientLight(0xffffff, 0.05));
const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 1.2, 1.2),
    new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xff7700, roughness: 0.5, metalness: 0 })
);
cube.rotation.set(0.4, 0.6, 0);
scene.add(cube);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
