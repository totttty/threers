<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
import { WebColor } from '/web/pkg/threers.js';
await initThreers('/web/pkg/threers_bg.wasm');
function solidFace(size, r, g, b) {
    const d = new Uint8Array(size * size * 4);
    for (let i = 0; i < size * size; i++) { d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=255; }
    return d;
}
const size = 32;
const src = new THREE.CubeTexture(size,
    solidFace(size, 255, 64, 64), solidFace(size, 64, 255, 64), solidFace(size, 64, 64, 255),
    solidFace(size, 255, 255, 64), solidFace(size, 255, 64, 255), solidFace(size, 64, 255, 255),
);
const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
r.setSize(800, 600);
const env = new THREE.PMREMGenerator(r).fromCubemap(src).texture;
const scene = new THREE.Scene();
scene.environment = env;
const mode = new URLSearchParams(location.search).get('mode') ?? '99';
scene._w.setFog(new WebColor(0, 0, 0), 0, 0, 0, Number(mode));
scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 24),
    new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.45 })
));
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
