<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        const room = new THREE.Scene();
        const walls = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10),
            new THREE.MeshBasicMaterial({ color: 0xff4444, side: THREE.BackSide }));
        room.add(walls);
        const cubeRT = new THREE.WebGLCubeRenderTarget(128);
        const cubeCam = new THREE.CubeCamera(0.1, 100, cubeRT);
        cubeCam.update(r, room);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        scene.environment = cubeRT.texture;
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16),
            new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1.0, roughness: 0.0 }));
        scene.add(sphere);
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
