<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#202024}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202024);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(2, 3, 4);
scene.add(dl);
const cubeBasic = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshBasicMaterial({ color: 0xff5555 }));
cubeBasic.position.set(-1.0, 0, 0);
cubeBasic.rotation.set(0.3, 0.5, 0);
scene.add(cubeBasic);
const cubeLambert = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshLambertMaterial({ color: 0x55ff55 }));
cubeLambert.position.set(0, 0, 0);
cubeLambert.rotation.set(0.3, 0.5, 0);
scene.add(cubeLambert);
const cubeStandard = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshStandardMaterial({ color: 0x5555ff, roughness: 0.4 }));
cubeStandard.position.set(1.0, 0, 0);
cubeStandard.rotation.set(0.3, 0.5, 0);
scene.add(cubeStandard);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3.6); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
