<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#222}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const canvas = document.getElementById('c');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        const size = 4;
        const data = new Uint8Array(size * size * 4);
        for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
            const v = (x + y) % 2 === 0 ? 255 : 64;
            const i = (y * size + x) * 4;
            data[i] = v; data[i+1] = v; data[i+2] = v; data[i+3] = 255;
        }
        const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.UnsignedByteType);
        tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearFilter;
        tex.needsUpdate = true;
        const cube = new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 1.5, 1.5),
            new THREE.MeshBasicMaterial({ map: tex })
        );
        cube.rotation.set(0.4, 0.5, 0);
        scene.add(cube);
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 4);
        cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(canvas);
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
