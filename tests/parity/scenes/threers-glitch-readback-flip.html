<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101418}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101010);
        scene.add(new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0x00ff88 })));
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        const composer = new THREE.EffectComposer(r);
        composer.addPass(new THREE.RenderPass(scene, cam));
        composer.addPass({ enabled: true, needsSwap: true, renderToScreen: true,
            async render(renderer, wb, rb) {
                const w = rb.width ?? 800, h = rb.height ?? 600;
                const f16 = await renderer.readRenderTargetF16(rb, 0, 0, w, h);
                const rowBytes = w * 8;
                const bytes = new Uint8Array(f16);
                const out = new Uint8Array(bytes.length);
                for (let y = 0; y < h; y++) {
                    const src = y * rowBytes;
                    const dst = (h - 1 - y) * rowBytes;
                    out.set(bytes.subarray(src, src + rowBytes), dst);
                }
                const u16 = new Uint16Array(out.buffer);
                const rgba = new Uint8Array(w * h * 4);
                const f = (h) => { const s=(h&0x8000)>>15,e=(h&0x7C00)>>10,ff=h&0x3FF; if(e===0)return(s?-1:1)*2**-14*(ff/1024); if(e===0x1F)return ff?NaN:(s?-Infinity:Infinity); return(s?-1:1)*2**(e-15)*(1+ff/1024); };
                const round = (x) => { const b=new ArrayBuffer(2); const v=new DataView(b); v.setFloat16(0,x,true); return v.getFloat16(0,true); };
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = y * w + x;
                        const j = i * 4;
                        const cx = Math.max(0, Math.min(w - 1, x));
                        const cy = Math.max(0, Math.min(h - 1, y));
                        const k = (cy * w + cx) * 4;
                        rgba[j] = Math.round(Math.max(0, Math.min(1, round(f(u16[k])))) * 255);
                        rgba[j+1] = Math.round(Math.max(0, Math.min(1, round(f(u16[k+1])))) * 255);
                        rgba[j+2] = Math.round(Math.max(0, Math.min(1, round(f(u16[k+2])))) * 255);
                        rgba[j+3] = Math.round(Math.max(0, Math.min(1, round(f(u16[k+3])))) * 255);
                    }
                }
                renderer._w.blitRgba8ToCanvas(rgba, w, h);
            } });
        await composer.render();
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
