<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

function solidFace(size, r, g, b) {
    const d = new Uint8Array(size * size * 4);
    for (let i = 0; i < size * size; i++) { d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=255; }
    const tex = new THREE.DataTexture(d, size, size, THREE.RGBAFormat);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}

const size = 32;
const src = new THREE.CubeTexture([
    solidFace(size, 255, 64, 64),
    solidFace(size, 64, 255, 64),
    solidFace(size, 64, 64, 255),
    solidFace(size, 255, 255, 64),
    solidFace(size, 255, 64, 255),
    solidFace(size, 64, 255, 255),
]);
src.colorSpace = THREE.SRGBColorSpace;
src.needsUpdate = true;

const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.NoToneMapping;

const pmrem = new THREE.PMREMGenerator(r);
const env = pmrem.fromCubemap(src);
pmrem.dispose();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
scene.environment = env.texture;

const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 24),
    new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.45 })
);
scene.add(sphere);

const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
