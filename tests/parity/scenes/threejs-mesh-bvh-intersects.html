<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101418}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js","three-mesh-bvh":"https://unpkg.com/three-mesh-bvh@0.7.6/build/index.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { MeshBVH } from 'three-mesh-bvh';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
const geom = new THREE.SphereGeometry(0.9, 24, 12);
const bvh = new MeshBVH(geom);
const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0x335588, roughness: 0.6 }));
scene.add(mesh);
const query = new THREE.Box3(new THREE.Vector3(-0.2, -0.2, -0.2), new THREE.Vector3(0.2, 0.2, 0.2));
const sphere = new THREE.Sphere(new THREE.Vector3(0.15, 0.1, 0), 0.35);
const boxHit = bvh.intersectsBox(query, new THREE.Matrix4());
const sphereHit = bvh.intersectsSphere(sphere);
const markerMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
if (boxHit) {
    const c = query.getCenter(new THREE.Vector3());
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), markerMat).translateX(c.x).translateY(c.y).translateZ(c.z));
}
if (sphereHit) {
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), markerMat).translateX(sphere.center.x).translateY(sphere.center.y).translateZ(sphere.center.z));
}
const cam = new THREE.PerspectiveCamera(50, 800/600, 0.1, 100);
cam.position.set(2, 1.5, 3); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
document.body.dataset.boxHit = String(boxHit);
document.body.dataset.sphereHit = String(sphereHit);
</script></body></html>
