<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#222}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const canvas = document.getElementById('c');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const dl = new THREE.DirectionalLight(0xffffff, 1.0);
        dl.position.set(2, 3, 4);
        scene.add(dl);
        const back = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5),
            new THREE.MeshStandardMaterial({ color: 0xcc4444, roughness: 0.5, metalness: 0 }));
        back.position.set(0.3, 0, -0.5);
        scene.add(back);
        const front = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.0),
            new THREE.MeshStandardMaterial({ color: 0x44cc44, roughness: 0.5, metalness: 0 }));
        front.position.set(-0.3, 0, 0.5);
        front.rotation.set(0.3, 0.3, 0);
        scene.add(front);
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 4);
        cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(canvas);
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
