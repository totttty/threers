<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0a0a14}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const size = 64;
        const data = new Uint8Array(size * size * 4);
        for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
            const cx = x - size / 2, cy = y - size / 2;
            const r = Math.hypot(cx, cy) / (size / 2);
            const k = Math.max(0, 1 - r);
            const i = (y * size + x) * 4;
            data[i] = 60 + k * 195;
            data[i + 1] = 80 + k * 175;
            data[i + 2] = 200 + k * 55;
            data[i + 3] = 255;
        }
        const tex = new THREE.DataTexture(data, size, size);
        tex.needsUpdate = true;
        const mat = new THREE.MeshMatcapMaterial({ matcap: tex });
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 16), mat);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a14);
        scene.add(sphere);
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
