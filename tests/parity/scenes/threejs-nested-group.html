<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#222428}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222428);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(1, 2, 3);
scene.add(dl);
const outer = new THREE.Group();
outer.position.set(0.4, 0, 0);
const inner = new THREE.Group();
inner.position.set(-0.6, 0.2, 0);
const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshStandardMaterial({ color: 0xffaa44, roughness: 0.5 }));
mesh.position.set(0.3, 0, 0);
inner.add(mesh);
outer.add(inner);
scene.add(outer);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0.4, 3); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
