<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#181818}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x181818);
        const a = new THREE.BufferGeometry();
        a.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-0.8,-0.3,0, -0.2,-0.3,0, -0.5,0.3,0]), 3));
        a.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array([0,0,1,0,0,1,0,0,1]), 3));
        a.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array([0,0,1,0,0.5,1]), 2));
        a.setIndex([0, 1, 2]);
        const b = new THREE.BufferGeometry();
        b.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0.2,-0.3,0, 0.8,-0.3,0, 0.5,0.3,0]), 3));
        b.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array([0,0,1,0,0,1,0,0,1]), 3));
        b.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array([0,0,1,0,0.5,1]), 2));
        b.setIndex([0, 1, 2]);
        const merged = THREE.BufferGeometryUtils.mergeGeometries([a, b]);
        const mesh = new THREE.Mesh(merged, new THREE.MeshBasicMaterial({ color: 0xff8844, side: THREE.DoubleSide }));
        scene.add(mesh);
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 2.4); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
