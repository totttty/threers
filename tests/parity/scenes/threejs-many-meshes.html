<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101418}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(2, 3, 4);
scene.add(dl);
// 4×4 grid of cubes
const geom = new THREE.BoxGeometry(0.35, 0.35, 0.35);
for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const hue = (i * 4 + j) / 16;
    const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.6, 0.55), roughness: 0.5, metalness: 0 });
    const m = new THREE.Mesh(geom, mat);
    m.position.set(i * 0.6 - 0.9, j * 0.6 - 0.9, 0);
    m.rotation.set(i * 0.3, j * 0.3, 0);
    scene.add(m);
}
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 4.5); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
