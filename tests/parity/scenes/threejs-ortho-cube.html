<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#181820}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181820);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(1, 2, 3);
scene.add(dl);
const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 1.2, 1.2),
    new THREE.MeshStandardMaterial({ color: 0xff44aa, roughness: 0.5, metalness: 0 })
);
cube.rotation.set(0.4, 0.7, 0.1);
scene.add(cube);
// Orthographic camera framed for an 800x600 viewport at ~2 world-unit width.
const aspect = 800/600;
const viewSize = 2.5;
const cam = new THREE.OrthographicCamera(-viewSize*aspect, viewSize*aspect, viewSize, -viewSize, 0.1, 100);
cam.position.set(2, 2, 3);
cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
