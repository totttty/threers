<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0a0c0e}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c0e);
const pts = [
    -0.7, -0.5, 0,
     0.7, -0.5, 0,
     0.7,  0.5, 0,
    -0.7,  0.5, 0
];
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
const loop = new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: 0x44ff88 }));
scene.add(loop);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 2.4); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
