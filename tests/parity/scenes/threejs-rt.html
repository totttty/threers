<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#181818}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
// Set up an offscreen render target — confirm the render-to-target call
// path doesn't pollute the final canvas render.
const offscreen = new THREE.WebGLRenderTarget(256, 256);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
// First, render a throwaway scene into the offscreen target.
const offScene = new THREE.Scene();
offScene.background = new THREE.Color(0xff0000);
const offCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
offCam.position.set(0, 0, 2); offCam.lookAt(0, 0, 0);
r.setRenderTarget(offscreen);
r.render(offScene, offCam);
r.setRenderTarget(null);
// Now render the visible scene onto the canvas.
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181818);
const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0x44aaff }));
mesh.rotation.set(0.3, 0.5, 0);
scene.add(mesh);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 3); cam.lookAt(0, 0, 0);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
