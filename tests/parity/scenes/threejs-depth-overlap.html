<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(2, 3, 4);
scene.add(dl);
// Two overlapping boxes — exercises depth buffer ordering.
const back = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5),
    new THREE.MeshStandardMaterial({ color: 0xcc4444, roughness: 0.5, metalness: 0 }));
back.position.set(0.3, 0, -0.5);
scene.add(back);
const front = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.0),
    new THREE.MeshStandardMaterial({ color: 0x44cc44, roughness: 0.5, metalness: 0 }));
front.position.set(-0.3, 0, 0.5);
front.rotation.set(0.3, 0.3, 0);
scene.add(front);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 4);
cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
