<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/RenderPass.js';
import { SSRPass } from 'https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/SSRPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dir = new THREE.DirectionalLight(0xffffff, 0.9);
dir.position.set(1, 3, 2);
scene.add(dir);

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 6),
    new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.15, metalness: 0.85 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.5;
scene.add(floor);

const cube = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshStandardMaterial({ color: 0xff5533, roughness: 0.4, metalness: 0.1 })
);
cube.position.set(0, 0.1, 0);
scene.add(cube);

const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 1.2, 3);
cam.lookAt(0, 0, 0);

const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);

const composer = new EffectComposer(r);
composer.addPass(new RenderPass(scene, cam));
const ssr = new SSRPass({ renderer: r, scene, camera: cam, width: 800, height: 600 });
ssr.opacity = 0.55;
ssr.maxDistance = 0.4;
composer.addPass(ssr);
composer.render();
document.body.dataset.ready = 'true';
</script></body></html>
