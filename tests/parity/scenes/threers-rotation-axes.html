<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#1a1a1a}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const canvas = document.getElementById('c');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const dl = new THREE.DirectionalLight(0xffffff, 1.0);
        dl.position.set(2, 3, 4);
        scene.add(dl);
        const mat = new THREE.MeshStandardMaterial({ color: 0xddaa55, roughness: 0.45, metalness: 0 });
        const x = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat);
        x.position.set(-1.4, 0, 0); x.rotation.set(Math.PI / 4, 0, 0);
        scene.add(x);
        const y = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat);
        y.position.set(0, 0, 0); y.rotation.set(0, Math.PI / 4, 0);
        scene.add(y);
        const z = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat);
        z.position.set(1.4, 0, 0); z.rotation.set(0, 0, Math.PI / 4);
        scene.add(z);
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0.3, 4); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(canvas);
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
