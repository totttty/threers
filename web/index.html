<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>threers — three.js-shaped Rust/wasm demo</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; color: #ccc; font-family: monospace; }
        #info { position: absolute; top: 8px; left: 8px; padding: 6px 10px; background: rgba(0,0,0,0.5); border-radius: 4px; z-index: 1; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }
        #error { position: absolute; bottom: 12px; left: 12px; right: 12px; padding: 12px; background: #500; color: #fdd; white-space: pre-wrap; font-size: 12px; display: none; }
    </style>
</head>
<body>
    <div id="info">threers — drop-in three.js shim demo · drag to orbit · <a href="/tests/parity/" style="color:#8cf">parity compare</a></div>
    <canvas id="canvas"></canvas>
    <div id="error"></div>

    <script type="module">
        import THREE, { initThreers } from './threejs-shim.js';

        const errorEl = document.getElementById('error');
        function showError(e) {
            errorEl.style.display = 'block';
            errorEl.textContent = (e && e.stack) ? e.stack : String(e);
            console.error(e);
        }

        async function main() {
            await initThreers();

            const canvas = document.getElementById('canvas');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = Math.floor(window.innerWidth * dpr);
            const h = Math.floor(window.innerHeight * dpr);
            canvas.width = w;
            canvas.height = h;

            const renderer = await THREE.WebGLRenderer.create(canvas);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202030);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            scene.add(new THREE.DirectionalLight(0xffffff, 1.0));

            const cube = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshStandardMaterial({ color: 0xff6633, roughness: 0.4, metalness: 0.1 })
            );
            scene.add(cube);

            const camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 100);
            camera.position.set(2.5, 2.0, 3.5);
            camera.lookAt(0, 0, 0);

            const controls = new THREE.OrbitControls(camera, canvas);

            window.addEventListener('resize', () => {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const w = Math.floor(window.innerWidth * dpr);
                const h = Math.floor(window.innerHeight * dpr);
                renderer.setSize(w, h);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
            });

            function frame() {
                controls.update();
                renderer.render(scene, camera);
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        main().catch(showError);
    </script>
</body>
</html>
